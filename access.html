<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오시는 길 | 서촌별곡</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section class="container fade-up" style="padding-top: 150px">
        <div class="text-center">
          <span class="section-subtitle">Location</span>
          <h2 class="section-title">찾아오시는 길</h2>
          <p class="copy-lead copy-medium copy-center">
            서촌의 고요한 골목을 따라 천천히 걸어오시면, 한옥의 온기를 담은
            서촌별곡을 만나실 수 있습니다.
          </p>
        </div>

        <!-- Use map illustration -->
        <div
          class="map-container custom-cursor fade-up"
          style="margin-top: 3rem"
        >
          <img
            src="images/map_illustration.jpg"
            alt="서촌별곡 약도"
            class="static-map-img"
            loading="lazy"
            decoding="async"
          />
          <div class="map-overlay">
            <div style="display: flex; gap: 1rem">
              <a
                href="https://map.naver.com/v5/search/서촌별곡"
                target="_blank"
                class="btn"
                >네이버 지도</a
              >
              <a
                href="https://map.kakao.com/link/search/서촌별곡"
                target="_blank"
                class="btn"
                style="
                  background-color: #ffe812;
                  color: #3c1e1e;
                  border-color: #ffe812;
                "
                >카카오맵</a
              >
            </div>
          </div>
        </div>

        <div
          class="location-info fade-up"
          style="
            margin-top: 3rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
          "
          >
          <div>
            <h3 class="info-title">주소</h3>
            <p class="copy-body">
              서울특별시 종로구 자하문로 123-45, 서촌의 조용한 골목 안쪽에
              자리하고 있습니다.
            </p>
          </div>
          <div>
            <h3 class="info-title">주차 안내</h3>
            <p class="copy-body">
              한옥 마을 특성상 전용 주차장은 운영하지 않습니다. 인근
              '신교 공영주차장' 이용을 권장드리며, 도보 약 3분 거리입니다.
            </p>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
  </body>
</html>
