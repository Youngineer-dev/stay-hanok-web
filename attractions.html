<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주변 명소 | 차담한옥</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="attractions">
    <div id="header-placeholder"></div>

    <main>
      <section class="container fade-up page-top-offset">
        <div class="text-center">
          <span class="section-subtitle" data-text="attractions.subtitle">Attractions</span>
          <h2 class="section-title" data-text="attractions.mainTitle">주변 가볼만한 곳</h2>
          <p class="copy-lead copy-medium copy-center" data-text="attractions.intro">
            차담한옥 인근의 아름다운 명소들을 소개합니다.<br />
            머무시는 동안 여유로운 발걸음으로 주변을 둘러보세요.
          </p>
        </div>

        <div class="special-grid" id="attractions-items">
          <!-- data.json attractions.items 배열에서 동적 생성 -->
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/data-loader.js"></script>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
    <script>
      window.dataLoadPromise.then(() => {
        const items = window.siteData?.attractions?.items || [];
        const grid = document.getElementById('attractions-items');

        items.forEach((item, i) => {
          // 거리 추출: e.g. "덕평공룡수목원 (6.4km)" -> cleanTitle: "덕평공룡수목원", distanceStr: "6.4km"
          const rawTitle = item.title || '';
          const distMatch = rawTitle.match(/\(([^)]+)\)/);
          const cleanTitle = rawTitle.replace(/\s*\([^)]+\)/, '').trim();
          const distanceStr = distMatch ? distMatch[1] : '';

          // 링크가 있으면 <a>로, 없으면 <div>로 생성
          const el = document.createElement(item.link ? 'a' : 'div');
          el.className = 'special-item attraction-card fade-up';
          el.id = `attr-${i}`;

          if (item.link) {
            el.href = item.link;
            el.target = '_blank';
            el.rel = 'noopener noreferrer';
          }

          el.innerHTML = `
            <div class="img-wrapper">
              <img
                src="${item.img || ''}"
                alt="${cleanTitle}"
                loading="${i === 0 ? 'eager' : 'lazy'}"
                decoding="async"
              />
              ${distanceStr ? `<span class="attraction-dist-badge">차량 ${distanceStr}</span>` : ''}
              ${item.link ? `<span class="attraction-link-chip">공식 웹사이트 ↗</span>` : ''}
            </div>
            <div class="attraction-card-content">
              <div class="attraction-meta-tag">NEARBY DESTINATION 0${i + 1}</div>
              <h3>${cleanTitle} <span class="link-arrow">↗</span></h3>
              <p class="copy-body">${item.desc || ''}</p>
            </div>
          `;
          grid.appendChild(el);
        });

        if (typeof window.observeFadeUps === 'function') {
          window.observeFadeUps();
        } else {
          document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
        }

        // 하위 메뉴에서 진입(#attr-n) 시, 카드가 DOM에 생성된 뒤 스크롤.
        // special.html과 동일한 robust 경로 — 향후 유니코드 id에도 안전.
        if (window.location.hash) {
          const id = decodeURIComponent(window.location.hash.slice(1));
          const target = document.getElementById(id);
          if (target) {
            setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
          }
        }
      });
    </script>
  </body>
</html>
