<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>갤러리 | 차담한옥(차담옥)</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="gallery">
    <div id="header-placeholder"></div>

    <!-- Sub-Hero Banner -->
    <div class="sub-hero">
      <img
        src="images/마당1.jpg"
        alt="차담옥 공간 갤러리"
        class="sub-hero-bg"
      />
      <div class="sub-hero-overlay"></div>
      <div class="sub-hero-content">
        <span class="sub-hero-subtitle" data-text="gallery.subtitle">PHOTO ARCHIVE</span>
        <h1 class="sub-hero-title" data-text="gallery.mainTitle">공간을 담다</h1>
        <p class="sub-hero-desc" data-text="gallery.intro">
          빛이 머무는 대청, 계절이 스며드는 마당, 차담옥의 온기 어린 순간들을 담았습니다.<br />
          이미지를 클릭하시면 고화질 원본으로 감상하실 수 있습니다.
        </p>
      </div>
    </div>

    <main>
      <section class="container fade-up" style="padding-top: 3.5rem; padding-bottom: 6rem;">
        <!-- Category Filter Tabs -->
        <div class="gallery-filter-nav fade-up">
          <button type="button" class="gallery-filter-btn is-active" data-filter="all">전체 (ALL)</button>
          <button type="button" class="gallery-filter-btn" data-filter="exterior">외관 & 마당 (EXTERIOR)</button>
          <button type="button" class="gallery-filter-btn" data-filter="interior">실내 & 객실 (INTERIOR)</button>
          <button type="button" class="gallery-filter-btn" data-filter="healing">다도 & 쉼 (HEALING)</button>
        </div>

        <div class="gallery-grid fade-up" id="gallery-items">
          <!-- data.json gallery.photos 배열에서 동적 생성 (역순) -->
        </div>

        <div class="gallery-more-wrap" id="gallery-more-wrap">
          <button
            type="button"
            id="gallery-more-btn"
            class="gallery-more-btn"
            style="display: none"
          >
            + 더보기
          </button>
        </div>
      </section>
    </main>

    <!-- 이미지 라이트박스 -->
    <div
      class="special-lightbox"
      id="gallery-lightbox"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <button class="lightbox-close" data-lb-close aria-label="창 닫기">
        창 닫기
      </button>
      <button class="lightbox-prev" data-lb-prev aria-label="이전 이미지">
        &lsaquo;
      </button>
      <button class="lightbox-next" data-lb-next aria-label="다음 이미지">
        &rsaquo;
      </button>
      <div class="lightbox-stage">
        <img class="lightbox-img" data-lb-img src="" alt="" />
        <div class="lightbox-info">
          <h3 class="lightbox-title" data-lb-title></h3>
          <p class="lightbox-desc" data-lb-desc></p>
          <span class="lightbox-counter" data-lb-counter></span>
        </div>
      </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="js/data-loader.js"></script>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
    <script src="js/lightbox.js"></script>
    <script>
      window.dataLoadPromise.then(() => {
        const photos = (window.siteData?.gallery?.photos || []).slice().reverse();
        const grid = document.getElementById("gallery-items");
        const moreBtn = document.getElementById("gallery-more-btn");
        const filterBtns = document.querySelectorAll(".gallery-filter-btn");
        if (!grid || photos.length === 0) return;

        // 사진별 카테고리 태깅 로직
        function categorizePhoto(photo, index) {
          const text = ((photo.alt || '') + ' ' + (photo.caption || '') + ' ' + (photo.img || '')).toLowerCase();
          if (/다도|차|티|커피|카페|음악|빔|시네마|불멍|바베큐|힐링|여백/.test(text)) return 'healing';
          if (/마당|외관|처마|기와|전경|꽃|나무|수목|하늘|풍경|자연/.test(text)) return 'exterior';
          if (/방|거실|대청|침대|주방|욕실|실내|내부|소품|조명/.test(text)) return 'interior';
          // 균형있는 배분을 위한 기본 할당
          const defaults = ['exterior', 'interior', 'healing'];
          return defaults[index % defaults.length];
        }

        const categorizedPhotos = photos.map((p, i) => ({
          ...p,
          category: categorizePhoto(p, i)
        }));

        let activeFilter = 'all';
        let currentFilteredPhotos = categorizedPhotos;
        const INITIAL_COUNT = 9;
        const INCREMENT = 9;
        let visibleCount = INITIAL_COUNT;

        const lightbox = window.createLightbox(
          document.getElementById("gallery-lightbox")
        );

        function renderGallery() {
          grid.innerHTML = '';
          currentFilteredPhotos = activeFilter === 'all'
            ? categorizedPhotos
            : categorizedPhotos.filter(p => p.category === activeFilter);

          visibleCount = Math.min(INITIAL_COUNT, currentFilteredPhotos.length);

          const lightboxItems = currentFilteredPhotos.map((p) => ({
            img: p.img,
            alt: p.alt || "",
            title: p.alt || "",
            desc: p.caption || "",
          }));

          currentFilteredPhotos.forEach((photo, i) => {
            const item = document.createElement("div");
            item.className = "gallery-item fade-up visible";
            item.setAttribute("role", "button");
            item.setAttribute("tabindex", "0");
            item.setAttribute("aria-label", `${photo.alt || "사진"} 크게 보기`);
            if (i >= visibleCount) item.classList.add("is-hidden");

            item.innerHTML = `
              <img
                src="${photo.img}"
                alt="${photo.alt || ""}"
                loading="${i < 9 ? "eager" : "lazy"}"
                decoding="async"
              />
              <div class="gallery-item-overlay">
                <h3 class="gallery-item-title">${photo.alt || ""}</h3>
                ${photo.caption ? `<p class="gallery-item-desc">${photo.caption}</p>` : ""}
              </div>
            `;

            const openAt = () => lightbox && lightbox.open(lightboxItems, i);
            item.addEventListener("click", openAt);
            item.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                openAt();
              }
            });
            grid.appendChild(item);
          });

          updateMoreBtn();
        }

        function updateMoreBtn() {
          if (!moreBtn) return;
          if (visibleCount >= currentFilteredPhotos.length) {
            moreBtn.style.display = "none";
          } else {
            moreBtn.style.display = "";
            const remaining = currentFilteredPhotos.length - visibleCount;
            moreBtn.textContent = `+ 더보기 (${remaining})`;
          }
        }

        if (moreBtn) {
          moreBtn.addEventListener("click", () => {
            const next = Math.min(visibleCount + INCREMENT, currentFilteredPhotos.length);
            const items = grid.querySelectorAll(".gallery-item");
            for (let j = visibleCount; j < next; j++) {
              items[j]?.classList.remove("is-hidden");
            }
            visibleCount = next;
            updateMoreBtn();
          });
        }

        // 필터 탭 이벤트
        filterBtns.forEach(btn => {
          btn.addEventListener("click", () => {
            filterBtns.forEach(b => b.classList.remove("is-active"));
            btn.classList.add("is-active");
            activeFilter = btn.dataset.filter;
            renderGallery();
          });
        });

        // 초기 렌더링
        renderGallery();
      });
    </script>
  </body>
</html>
