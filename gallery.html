<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>갤러리 | 차담한옥(차담옥)</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="gallery">
    <div id="header-placeholder"></div>

    <!-- Bright Hanji Editorial Masthead -->
    <section class="page-masthead">
      <div class="container masthead-inner">
        <div class="masthead-main">
          <span class="masthead-kicker">
            <span class="logo-seal is-small" aria-hidden="true">茶談</span>
            <span data-text="gallery.subtitle">공간 사진첩</span>
          </span>
          <h1 class="masthead-title" data-text="gallery.mainTitle">빛과 계절이 머무는 풍경</h1>
          <p class="masthead-desc" data-text="gallery.intro">
            대청의 햇살과 마당의 사계절, 차담옥의 하루를 담았습니다. 사진을 누르면 원본 크기로 감상하실 수 있습니다.
          </p>
        </div>
        <span class="masthead-vertical-note" aria-hidden="true">사계절 · 마당 · 대청</span>
      </div>
    </section>

    <main>
      <section class="section-band" style="padding-top: 1.5rem;">
        <div class="container">
          <!-- Sticky Horizontal Filter Tabs -->
          <div class="gallery-sticky-bar">
            <div class="scroll-tabs" role="tablist" aria-label="갤러리 분류">
              <button type="button" class="scroll-tab-btn gallery-filter-btn is-active" data-filter="all" role="tab" aria-selected="true">전체 보기</button>
              <button type="button" class="scroll-tab-btn gallery-filter-btn" data-filter="exterior" role="tab" aria-selected="false">외관과 마당</button>
              <button type="button" class="scroll-tab-btn gallery-filter-btn" data-filter="interior" role="tab" aria-selected="false">대청과 침실</button>
              <button type="button" class="scroll-tab-btn gallery-filter-btn" data-filter="seasons" role="tab" aria-selected="false">다도와 사계절</button>
            </div>
          </div>

          <div class="gallery-archive-grid" id="gallery-items">
            <!-- data.json gallery.photos 배열에서 동적 생성 -->
          </div>

          <div class="gallery-more-wrap" id="gallery-more-wrap">
            <button
              type="button"
              id="gallery-more-btn"
              class="btn-outline"
              style="display: none"
            >
              사진 더 보기
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- 이미지 라이트박스 -->
    <div
      class="special-lightbox"
      id="gallery-lightbox"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <button class="lightbox-close" data-lb-close aria-label="창 닫기">닫기 ✕</button>
      <button class="lightbox-prev" data-lb-prev aria-label="이전 이미지">&lsaquo;</button>
      <button class="lightbox-next" data-lb-next aria-label="다음 이미지">&rsaquo;</button>
      <div class="lightbox-stage">
        <img class="lightbox-img" data-lb-img src="" alt="" />
        <div class="lightbox-info">
          <h3 class="lightbox-title" data-lb-title></h3>
          <p class="lightbox-desc" data-lb-desc></p>
          <span class="lightbox-counter" data-lb-counter></span>
        </div>
      </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="js/data-loader.js"></script>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
    <script src="js/lightbox.js"></script>
    <script>
      window.dataLoadPromise.then(() => {
        const photos = window.siteData?.gallery?.photos || [];
        const grid = document.getElementById("gallery-items");
        const moreBtn = document.getElementById("gallery-more-btn");
        const filterBtns = document.querySelectorAll(".gallery-filter-btn");
        if (!grid || photos.length === 0) return;

        function categorizePhoto(photo, index) {
          if (photo.category) return photo.category;
          const text = ((photo.alt || "") + " " + (photo.caption || "") + " " + (photo.img || "")).toLowerCase();
          if (/다도|차|티|봄|여름|가을|겨울|아궁이/.test(text)) return "seasons";
          if (/마당|외관|처마|바베큐|텃밭/.test(text)) return "exterior";
          if (/방|거실|대청|침실|주방|라운지/.test(text)) return "interior";
          const defaults = ["exterior", "interior", "seasons"];
          return defaults[index % defaults.length];
        }

        const categorizedPhotos = photos.map((p, i) => ({
          ...p,
          category: categorizePhoto(p, i),
        }));

        const counts = {
          all: categorizedPhotos.length,
          exterior: categorizedPhotos.filter((p) => p.category === "exterior").length,
          interior: categorizedPhotos.filter((p) => p.category === "interior").length,
          seasons: categorizedPhotos.filter((p) => p.category === "seasons").length,
        };
        const labels = {
          all: "전체 보기",
          exterior: "외관과 마당",
          interior: "대청과 침실",
          seasons: "다도와 사계절",
        };
        filterBtns.forEach((btn) => {
          const key = btn.dataset.filter;
          if (labels[key]) {
            btn.textContent = `${labels[key]} (${counts[key] || 0})`;
          }
        });

        let activeFilter = "all";
        let currentFilteredPhotos = categorizedPhotos;
        const INITIAL_COUNT = 12;
        const INCREMENT = 12;
        let visibleCount = INITIAL_COUNT;

        const lightbox = window.createLightbox(document.getElementById("gallery-lightbox"));

        function renderGallery() {
          grid.innerHTML = "";
          currentFilteredPhotos =
            activeFilter === "all"
              ? categorizedPhotos
              : categorizedPhotos.filter((p) => p.category === activeFilter);

          visibleCount = Math.min(INITIAL_COUNT, currentFilteredPhotos.length);

          const lightboxItems = currentFilteredPhotos.map((p) => ({
            img: p.img,
            alt: p.alt || "",
            title: p.alt || "",
            desc: p.caption || "",
          }));

          currentFilteredPhotos.forEach((photo, i) => {
            const item = document.createElement("article");
            item.className = "gallery-archive-item fade-up visible";
            item.setAttribute("role", "button");
            item.setAttribute("tabindex", "0");
            item.setAttribute("aria-label", `${photo.alt || "사진"} 크게 보기`);
            if (i >= visibleCount) item.classList.add("is-hidden");

            item.innerHTML = `
              <div class="gallery-photo-frame">
                <img
                  src="${photo.img}"
                  alt="${photo.alt || ""}"
                  loading="${i < 8 ? "eager" : "lazy"}"
                  decoding="async"
                />
              </div>
              <div class="gallery-caption-bar">
                <h3 class="gallery-item-title">${photo.alt || ""}</h3>
                ${photo.caption ? `<p class="gallery-item-desc">${photo.caption}</p>` : ""}
              </div>
            `;

            const openAt = () => lightbox && lightbox.open(lightboxItems, i);
            item.addEventListener("click", openAt);
            item.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                openAt();
              }
            });
            grid.appendChild(item);
          });

          updateMoreBtn();
        }

        function updateMoreBtn() {
          if (!moreBtn) return;
          if (visibleCount >= currentFilteredPhotos.length) {
            moreBtn.style.display = "none";
          } else {
            moreBtn.style.display = "";
            const remaining = currentFilteredPhotos.length - visibleCount;
            moreBtn.textContent = `사진 더 보기 (${remaining}장)`;
          }
        }

        if (moreBtn) {
          moreBtn.addEventListener("click", () => {
            const next = Math.min(visibleCount + INCREMENT, currentFilteredPhotos.length);
            const items = grid.querySelectorAll(".gallery-archive-item");
            for (let j = visibleCount; j < next; j++) {
              items[j]?.classList.remove("is-hidden");
            }
            visibleCount = next;
            updateMoreBtn();
          });
        }

        filterBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            filterBtns.forEach((b) => {
              b.classList.remove("is-active");
              b.setAttribute("aria-selected", "false");
            });
            btn.classList.add("is-active");
            btn.setAttribute("aria-selected", "true");
            activeFilter = btn.dataset.filter;
            renderGallery();
          });
        });

        renderGallery();
      });
    </script>
  </body>
</html>
