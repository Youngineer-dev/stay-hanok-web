<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Special | 서촌별곡</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="special">
    <div id="header-placeholder"></div>

    <main>
      <section class="container fade-up" style="padding-top: 150px">
        <div class="text-center">
          <span class="section-subtitle" data-text="special.subtitle">Experience</span>
          <h2 class="section-title" data-text="special.mainTitle">특별한 경험</h2>
          <p class="copy-lead copy-medium copy-center" data-text="special.intro">
            서촌별곡의 스테이는 머무름을 넘어 경험으로 확장됩니다.<br />
            하루의 속도를
            낮추고, 취향에 맞는 순간을 천천히 채워보세요.
          </p>
        </div>

        <div class="special-grid" id="special-items">
          <!-- data.json special.items 배열에서 동적 생성 -->
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/data-loader.js"></script>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
    <script>
      window.dataLoadPromise.then(() => {
        const items = window.siteData?.special?.items || [];
        const grid = document.getElementById('special-items');

        items.forEach((item, i) => {
          const el = document.createElement('div');
          el.className = 'special-item fade-up';
          el.innerHTML = `
            <img
              src="${item.img || ''}"
              alt="${item.title || ''}"
              loading="${i === 0 ? 'eager' : 'lazy'}"
              decoding="async"
            />
            <h3>${item.title || ''}</h3>
            <p class="copy-body">${item.desc || ''}</p>
          `;
          grid.appendChild(el);
        });

        // fade-up 옵저버가 동적 요소도 감지하도록 재등록
        if (typeof window.observeFadeUps === 'function') {
          window.observeFadeUps();
        } else {
          document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
        }
      });
    </script>
  </body>
</html>
