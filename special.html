<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>머무는 즐거움 | 차담한옥(차담옥)</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="special">
    <div id="header-placeholder"></div>

    <!-- Bright Hanji Editorial Masthead -->
    <section class="page-masthead">
      <div class="container masthead-inner">
        <div class="masthead-main">
          <span class="masthead-kicker">
            <span class="logo-seal is-small" aria-hidden="true">茶談</span>
            <span data-text="special.subtitle">머무는 즐거움</span>
          </span>
          <h1 class="masthead-title" data-text="special.mainTitle">차담옥의 특별한 경험</h1>
          <p class="masthead-desc" data-text="special.intro">
            머무는 동안 하루의 속도를 천천히 늦추고, 취향에 맞는 고요한 즐거움을 채워보세요.
          </p>
        </div>
        <span class="masthead-vertical-note" aria-hidden="true">다도 · 바비큐 · 시네마</span>
      </div>
    </section>

    <main>
      <section class="section-band" style="padding-top: clamp(1.8rem, 3vw, 2.6rem);">
        <div class="container">
          <!-- Horizontal Quick Jump Tabs (Great on Mobile!) -->
          <div class="scroll-tabs fade-up" id="special-jump-nav" aria-label="경험 빠른 이동">
            <!-- data.json special.items 그룹에서 동적 생성 -->
          </div>

          <div class="editorial-special-list" id="special-editorial-list">
            <!-- data.json special.items에서 동적 생성 -->
          </div>
        </div>
      </section>
    </main>

    <!-- 이미지 라이트박스 -->
    <div class="special-lightbox" id="special-lightbox" aria-hidden="true" role="dialog" aria-modal="true">
      <button class="lightbox-close" data-lb-close aria-label="창 닫기">닫기 ✕</button>
      <button class="lightbox-prev" data-lb-prev aria-label="이전 이미지">&lsaquo;</button>
      <button class="lightbox-next" data-lb-next aria-label="다음 이미지">&rsaquo;</button>
      <div class="lightbox-stage">
        <img class="lightbox-img" data-lb-img src="" alt="" />
        <div class="lightbox-info">
          <h3 class="lightbox-title" data-lb-title></h3>
          <p class="lightbox-desc" data-lb-desc></p>
          <span class="lightbox-counter" data-lb-counter></span>
        </div>
      </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="js/data-loader.js"></script>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
    <script src="js/lightbox.js"></script>
    <script>
      window.dataLoadPromise.then(() => {
        const items = window.siteData?.special?.items || [];
        const container = document.getElementById("special-editorial-list");
        const jumpNav = document.getElementById("special-jump-nav");
        const lightbox = window.createLightbox(document.getElementById("special-lightbox"));

        if (!container || items.length === 0) return;

        const normalizeTitle = (t) => (t || "").replace(/\s+/g, "").toLowerCase();
        const groupMap = new Map();
        items.forEach((item) => {
          const key = normalizeTitle(item.title);
          if (!groupMap.has(key)) groupMap.set(key, []);
          groupMap.get(key).push(item);
        });
        const groups = Array.from(groupMap.values());
        const hanjaNums = ["一", "二", "三", "四", "五", "六", "七"];

        groups.forEach((group, i) => {
          const first = group[0];
          const normKey = normalizeTitle(first.title);
          const isReverse = i % 2 === 1;
          const spaceInfo = first.space || "차담옥 독채 전용 공간";
          const guideInfo = first.guide || "투숙 기간 내 자유 이용";

          if (jumpNav) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = `scroll-tab-btn${i === 0 ? " is-active" : ""}`;
            btn.textContent = first.title || "";
            btn.addEventListener("click", () => {
              jumpNav.querySelectorAll(".scroll-tab-btn").forEach((b) => b.classList.remove("is-active"));
              btn.classList.add("is-active");
              document.getElementById(`sp-${normKey}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
            });
            jumpNav.appendChild(btn);
          }

          const thumbsHtml =
            group.length > 1
              ? `<div class="special-thumb-strip" role="group" aria-label="${first.title || ""} 추가 사진">
                  ${group
                    .map(
                      (gItem, thumbIdx) => `
                        <button
                          type="button"
                          class="special-thumb-btn${thumbIdx === 0 ? " is-active" : ""}"
                          data-thumb-idx="${thumbIdx}"
                          aria-label="${first.title || ""} 사진 ${thumbIdx + 1}"
                        >
                          <img src="${gItem.img || ""}" alt="${first.title || ""} ${thumbIdx + 1}" loading="lazy" decoding="async" />
                        </button>
                      `
                    )
                    .join("")}
                </div>`
              : "";

          const row = document.createElement("article");
          row.className = `editorial-special-row${isReverse ? " reverse" : ""} fade-up`;
          row.id = `sp-${normKey}`;

          row.innerHTML = `
            <div class="editorial-media-group">
              <div class="editorial-media" role="button" tabindex="0" aria-label="${first.title || ""} 사진 크게 보기">
                <img
                  src="${first.img || ""}"
                  alt="${first.title || ""}"
                  loading="${i === 0 ? "eager" : "lazy"}"
                  decoding="async"
                />
              </div>
              ${thumbsHtml}
            </div>
            <div class="editorial-text">
              <span class="editorial-num">${hanjaNums[i] || `0${i + 1}`} · 머무는 즐거움</span>
              <h3>${first.title || ""}</h3>
              <p class="editorial-desc">${first.desc || ""}</p>
              <div class="special-meta-table">
                <div class="special-meta-row">
                  <span class="special-meta-label">이용 공간</span>
                  <span class="special-meta-val">${spaceInfo}</span>
                </div>
                <div class="special-meta-row">
                  <span class="special-meta-label">이용 안내</span>
                  <span class="special-meta-val">${guideInfo}</span>
                </div>
              </div>
              <button type="button" class="btn-outline special-view-btn">
                ${group.length > 1 ? `사진 크게 보기 (${group.length}장)` : "사진 크게 보기"}
              </button>
            </div>
          `;

          let currentIndex = 0;
          const mainMediaEl = row.querySelector(".editorial-media");
          const mainImgEl = mainMediaEl.querySelector("img");
          const thumbBtns = row.querySelectorAll(".special-thumb-btn");

          thumbBtns.forEach((btn) => {
            btn.addEventListener("click", () => {
              const idx = Number(btn.dataset.thumbIdx || 0);
              currentIndex = idx;
              if (mainImgEl && group[idx]) {
                mainImgEl.src = group[idx].img || "";
              }
              thumbBtns.forEach((b, bIdx) => b.classList.toggle("is-active", bIdx === idx));
            });
          });

          const openLightbox = () => lightbox && lightbox.open(group, currentIndex);
          mainMediaEl.addEventListener("click", openLightbox);
          mainMediaEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openLightbox();
            }
          });
          row.querySelector(".special-view-btn").addEventListener("click", openLightbox);

          container.appendChild(row);
        });

        if (typeof window.observeFadeUps === "function") {
          window.observeFadeUps();
        }

        if (window.location.hash) {
          const id = decodeURIComponent(window.location.hash.slice(1));
          const target = document.getElementById(id);
          if (target) {
            setTimeout(() => target.scrollIntoView({ behavior: "smooth", block: "start" }), 120);
          }
        }
      });
    </script>
  </body>
</html>
