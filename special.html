<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Special | 차담한옥(차담옥)</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="special">
    <div id="header-placeholder"></div>

    <!-- Sub-Hero Banner -->
    <div class="sub-hero">
      <img
        src="images/special_bbq.jpg"
        alt="차담옥 특별한 경험"
        class="sub-hero-bg"
      />
      <div class="sub-hero-overlay"></div>
      <div class="sub-hero-content">
        <span class="sub-hero-subtitle" data-text="special.subtitle">EXPERIENCE & MEMORIES</span>
        <h1 class="sub-hero-title" data-text="special.mainTitle">특별한 경험</h1>
        <p class="sub-hero-desc" data-text="special.intro">
          차담옥의 스테이는 단순한 머무름을 넘어 취향과 감각의 경험으로 확장됩니다.<br />
          하루의 속도를 늦추고, 온전히 나에게 집중하는 순간을 채워보세요.
        </p>
      </div>
    </div>

    <main>
      <section class="container fade-up" style="padding-top: 4rem; padding-bottom: 6rem;">
        <div class="editorial-special-list" id="special-editorial-list">
          <!-- 동적 에디토리얼 Z-패턴 스토리텔링 블록 렌더링 -->
        </div>
      </section>
    </main>

    <!-- 이미지 라이트박스 갤러리 -->
    <div class="special-lightbox" id="special-lightbox" aria-hidden="true" role="dialog" aria-modal="true">
      <button class="lightbox-close" data-lb-close aria-label="창 닫기">창 닫기</button>
      <button class="lightbox-prev" data-lb-prev aria-label="이전 이미지">&lsaquo;</button>
      <button class="lightbox-next" data-lb-next aria-label="다음 이미지">&rsaquo;</button>
      <div class="lightbox-stage">
        <img class="lightbox-img" data-lb-img src="" alt="" />
        <div class="lightbox-info">
          <h3 class="lightbox-title" data-lb-title></h3>
          <p class="lightbox-desc" data-lb-desc></p>
          <span class="lightbox-counter" data-lb-counter></span>
        </div>
      </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="js/data-loader.js"></script>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
    <script src="js/lightbox.js"></script>
    <script>
      window.dataLoadPromise.then(() => {
        const items = window.siteData?.special?.items || [];
        const container = document.getElementById('special-editorial-list');
        const lightbox = window.createLightbox(document.getElementById('special-lightbox'));

        // 경험별 큐레이션 태그 맵
        const experienceTags = {
          '다도체험': ['전통 잎차 무상 제공', '정갈한 백자 다기', '대청마루 명상'],
          '카페테리아&라운지': ['스페셜티 원두 커피', '한옥 마당 정취', '투숙객 전용 라운지'],
          '프라이빗빔시네마': ['150인치 대형 스크린', '고화질 빔프로젝터', '넷플릭스 & OTT 지원'],
          '어쿠스틱&엔터테인먼트': ['통기타 & 마이크 완비', '방음 프라이빗 공간', '추억의 음악 여행'],
          '사계절전용바베큐장': ['사계절 냉·난방 완비', '프라이빗 다이닝', '우천 시 정상 이용'],
          '유기농텃밭힐링': ['친환경 제철 채소', '자연 수확의 기쁨', '소박한 흙의 온기']
        };

        // 제목 기준 그룹핑
        const normalizeTitle = (t) => (t || '').replace(/\s+/g, '').toLowerCase();
        const groupMap = new Map();
        items.forEach((item) => {
          const key = normalizeTitle(item.title);
          if (!groupMap.has(key)) groupMap.set(key, []);
          groupMap.get(key).push(item);
        });
        const groups = Array.from(groupMap.values());

        // 매거진 에디토리얼 Z-패턴 렌더링
        groups.forEach((group, i) => {
          const first = group[0];
          const normKey = normalizeTitle(first.title);
          const isReverse = i % 2 === 1;
          const tags = experienceTags[normKey] || ['프라이빗 독채', '한옥 스테이', '감성 힐링'];

          const row = document.createElement('div');
          row.className = `editorial-special-row ${isReverse ? 'reverse' : ''} fade-up`;
          row.id = `sp-${normKey}`;

          row.innerHTML = `
            <div class="editorial-media" role="button" tabindex="0" aria-label="${first.title || ''} 사진 크게 보기">
              <img
                src="${first.img || ''}"
                alt="${first.title || ''}"
                loading="${i === 0 ? 'eager' : 'lazy'}"
                decoding="async"
              />
              ${group.length > 1 ? `<span class="editorial-media-badge">+${group.length - 1}장의 사진</span>` : ''}
              <div class="editorial-zoom-bar">
                <span>클릭하여 갤러리 감상</span>
                <span>↗</span>
              </div>
            </div>
            <div class="editorial-text">
              <span class="editorial-num">EXPERIENCE 0${i + 1}</span>
              <h3>${first.title || ''}</h3>
              <p class="editorial-desc">${first.desc || ''}</p>
              <div class="editorial-tags">
                ${tags.map(tag => `<span class="editorial-tag-item"># ${tag}</span>`).join('')}
              </div>
              <button type="button" class="editorial-btn-view" aria-label="${first.title || ''} 갤러리 감상">
                <span>포토 갤러리 감상 (총 ${group.length}장)</span>
                <span>↗</span>
              </button>
            </div>
          `;

          const openLightbox = () => lightbox && lightbox.open(group, 0);
          row.querySelector('.editorial-media').addEventListener('click', openLightbox);
          row.querySelector('.editorial-media').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openLightbox();
            }
          });
          row.querySelector('.editorial-btn-view').addEventListener('click', openLightbox);

          container.appendChild(row);
        });

        if (typeof window.observeFadeUps === 'function') {
          window.observeFadeUps();
        } else {
          document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
        }

        // 앵커 이동
        if (window.location.hash) {
          const id = decodeURIComponent(window.location.hash.slice(1));
          const target = document.getElementById(id);
          if (target) {
            setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
          }
        }
      });
    </script>
  </body>
</html>
