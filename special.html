<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Special | 차담한옥(차담옥)</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="special">
    <div id="header-placeholder"></div>

    <main>
      <section class="container fade-up page-top-offset">
        <div class="text-center">
          <span class="section-subtitle" data-text="special.subtitle">Experience</span>
          <h2 class="section-title" data-text="special.mainTitle">특별한 경험</h2>
          <p class="copy-lead copy-medium copy-center" data-text="special.intro">
            차담한옥의 스테이는 머무름을 넘어 경험으로 확장됩니다.<br />
            하루의 속도를
            낮추고, 취향에 맞는 순간을 천천히 채워보세요.
          </p>
        </div>

        <div class="special-grid" id="special-items">
          <!-- data.json special.items 배열에서 동적 생성 (제목별 그룹) -->
        </div>
      </section>
    </main>

    <!-- 이미지 라이트박스 갤러리 -->
    <div class="special-lightbox" id="special-lightbox" aria-hidden="true" role="dialog" aria-modal="true">
      <button class="lightbox-close" data-lb-close aria-label="창 닫기">창 닫기</button>
      <button class="lightbox-prev" data-lb-prev aria-label="이전 이미지">&lsaquo;</button>
      <button class="lightbox-next" data-lb-next aria-label="다음 이미지">&rsaquo;</button>
      <div class="lightbox-stage">
        <img class="lightbox-img" data-lb-img src="" alt="" />
        <div class="lightbox-info">
          <h3 class="lightbox-title" data-lb-title></h3>
          <p class="lightbox-desc" data-lb-desc></p>
          <span class="lightbox-counter" data-lb-counter></span>
        </div>
      </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="js/data-loader.js"></script>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
    <script src="js/lightbox.js"></script>
    <script>
      window.dataLoadPromise.then(() => {
        const items = window.siteData?.special?.items || [];
        const grid = document.getElementById('special-items');
        const lightbox = window.createLightbox(document.getElementById('special-lightbox'));

        // 제목 기준 그룹핑 (공백 제거 + 소문자화로 정규화, 입력 순서 유지)
        const normalizeTitle = (t) => (t || '').replace(/\s+/g, '').toLowerCase();
        const groupMap = new Map();
        items.forEach((item) => {
          const key = normalizeTitle(item.title);
          if (!groupMap.has(key)) groupMap.set(key, []);
          groupMap.get(key).push(item);
        });
        const groups = Array.from(groupMap.values());

        // 그룹별로 첫 항목을 카드로 렌더링
        groups.forEach((group, i) => {
          const first = group[0];
          const el = document.createElement('div');
          el.className = 'special-item fade-up';
          el.setAttribute('role', 'button');
          el.setAttribute('tabindex', '0');
          el.setAttribute('aria-label', `${first.title || ''} 이미지 크게 보기`);
          el.innerHTML = `
            <div class="special-item-img">
              <img
                src="${first.img || ''}"
                alt="${first.title || ''}"
                loading="${i === 0 ? 'eager' : 'lazy'}"
                decoding="async"
              />
              ${group.length > 1 ? `<span class="special-item-count" aria-hidden="true">+${group.length - 1}</span>` : ''}
            </div>
            <h3>${first.title || ''}</h3>
            <p class="copy-body">${first.desc || ''}</p>
          `;
          const open = () => lightbox && lightbox.open(group, 0);
          el.addEventListener('click', open);
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              open();
            }
          });
          grid.appendChild(el);
        });

        if (typeof window.observeFadeUps === 'function') {
          window.observeFadeUps();
        } else {
          document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
        }
      });
    </script>
  </body>
</html>
