<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예약 및 문의 | 차담한옥(차담옥)</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="reserve">
    <div id="header-placeholder"></div>

    <main>
      <section class="container fade-up page-top-offset">
        <div class="text-center">
          <span class="section-subtitle" data-text="reserve.subtitle">Reservation</span>
          <h2 class="section-title" data-text="reserve.mainTitle">예약 및 문의</h2>
          <p class="copy-lead copy-medium copy-center" data-text="reserve.intro">
            예약은 네이버 예약으로 간편하게 진행됩니다.<br />
            숙박 전 문의가 필요한
            경우 전화 또는 카카오톡으로 편하게 연락해 주세요.
          </p>
        </div>

        <div class="content-card mt-3">
          <h3 class="copy-headline copy-center" data-text="reserve.reserveTitle">실시간 예약</h3>
          <p class="copy-body copy-medium copy-center" data-text="reserve.reserveDesc">
            원하시는 날짜와 인원을 선택한 뒤, 네이버 예약 페이지에서 결제를
            완료해 주세요.
          </p>
          <div class="text-center" style="margin-bottom: 3rem">
            <a
              href="#"
              class="btn btn-naver"
              data-text="reserve.naverBtn"
              data-link="reserve.naverLink"
              target="_blank"
              >네이버 예약 바로가기</a
            >
          </div>

          <hr class="content-card-divider" />

          <h3 class="copy-headline copy-center" data-text="reserve.contactTitle">문의하기</h3>
          <p class="copy-body copy-center" data-text="reserve.contactDesc">
            운영 시간 내 순차적으로 신속하게 안내드립니다.
          </p>
          <div class="btn-row">
            <a href="tel:01012345678" class="btn-outline" data-text="reserve.phoneBtn" data-link="reserve.phoneLink">전화 문의</a>
            <a
              href="#"
              class="btn-outline btn-kakao"
              data-text="reserve.kakaoBtn"
              data-link="reserve.kakaoLink"
              target="_blank"
              >카카오톡 상담</a
            >
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/data-loader.js"></script>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
  </body>
</html>
