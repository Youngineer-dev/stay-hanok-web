<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예약 및 문의 | 서촌별곡</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section class="container fade-up" style="padding-top: 150px">
        <div class="text-center">
          <span class="section-subtitle">Reservation</span>
          <h2 class="section-title">예약 및 문의</h2>
          <p class="copy-lead copy-medium copy-center">
            예약은 네이버 예약으로 간편하게 진행됩니다. 숙박 전 문의가 필요한
            경우 전화 또는 카카오톡으로 편하게 연락해 주세요.
          </p>
        </div>

        <div
          style="
            max-width: 800px;
            margin: 0 auto;
            background: var(--color-white);
            padding: 3rem;
            border-radius: 4px;
            box-shadow: var(--shadow-soft);
          "
        >
          <!-- Updated container style for better visibility on white bg -->
          <h3 class="copy-headline copy-center">실시간 예약</h3>
          <p class="copy-body copy-medium copy-center">
            원하시는 날짜와 인원을 선택한 뒤, 네이버 예약 페이지에서 결제를
            완료해 주세요.
          </p>
          <div class="text-center" style="margin-bottom: 3rem">
            <a
              href="#"
              class="btn"
              style="
                background-color: #03cf5d;
                border-color: #03cf5d;
                color: white;
              "
              >네이버 예약 바로가기</a
            >
          </div>

          <hr
            style="
              background: var(--color-border);
              height: 1px;
              border: none;
              margin: 2rem 0;
            "
          />

          <h3 class="copy-headline copy-center">문의하기</h3>
          <p class="copy-body copy-center">
            운영 시간 내 순차적으로 신속하게 안내드립니다.
          </p>
          <div
            style="
              display: flex;
              justify-content: center;
              gap: 1rem;
              flex-wrap: wrap;
            "
          >
            <a href="tel:01012345678" class="btn-outline">전화 문의</a>
            <a
              href="#"
              class="btn-outline"
              style="
                background-color: #fae100;
                border-color: #fae100;
                color: #3c1e1e;
              "
              >카카오톡 상담</a
            >
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
  </body>
</html>
