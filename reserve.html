<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예약 및 문의 | 서촌별곡</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section class="container fade-up" style="padding-top: 150px">
        <div class="text-center">
          <span class="section-subtitle">Reservation</span>
          <h2 class="section-title">예약 및 문의</h2>
        </div>

        <div
          style="
            max-width: 800px;
            margin: 0 auto;
            background: var(--color-white);
            padding: 3rem;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-soft);
          "
        >
          <h3 style="margin-bottom: 1.5rem; text-align: center">실시간 예약</h3>
          <p
            class="text-center"
            style="margin-bottom: 2rem; color: var(--color-text-sub)"
          >
            아래 버튼을 클릭하시면 네이버 예약 페이지로 이동합니다.
          </p>
          <div class="text-center" style="margin-bottom: 3rem">
            <a
              href="#"
              class="btn"
              style="
                background-color: #03cf5d;
                border-color: #03cf5d;
                color: white;
              "
              >네이버 예약 바로가기</a
            >
          </div>

          <hr
            style="
              background: var(--color-border);
              height: 1px;
              border: none;
              margin: 2rem 0;
            "
          />

          <h3 style="margin-bottom: 1.5rem; text-align: center">문의하기</h3>
          <div
            style="
              display: flex;
              justify-content: center;
              gap: 1rem;
              flex-wrap: wrap;
            "
          >
            <a href="tel:01012345678" class="btn-outline">📞 전화 문의</a>
            <a
              href="#"
              class="btn-outline"
              style="
                background-color: #fae100;
                border-color: #fae100;
                color: #3c1e1e;
              "
              >💬 카카오톡 상담</a
            >
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
    <!-- ADDED -->
  </body>
</html>
