<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>소개 | 서촌별곡</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section class="container" style="padding-top: 150px">
        <div class="text-center">
          <span class="section-subtitle">Story</span>
          <h2 class="section-title">서촌별곡 이야기</h2>
          <div style="margin: 3rem 0">
            <img
              src="https://placehold.co/1200x600/4a3b32/ffffff?text=Hanok+Story"
              alt="한옥 스토리"
            />
          </div>
          <p
            style="
              line-height: 2;
              color: var(--color-text-sub);
              max-width: 700px;
              margin: 0 auto;
            "
          >
            오래된 것에는 시간이 빚어낸 아름다움이 있습니다.<br />
            서촌의 좁은 골목을 지나 마주하는 서촌별곡은 1930년대의 시간을
            기억합니다.<br /><br />
            황토 흙벽이 내어주는 포근함과 대들보의 묵직함,<br />
            그리고 마당 한편에 자리 잡은 소나무까지.<br />
            이곳에서의 하루가 당신에게 깊은 위로가 되기를 바랍니다.
          </p>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/include.js"></script>
  </body>
</html>
