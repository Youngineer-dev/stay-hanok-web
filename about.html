<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us | 서촌별곡</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section class="container fade-up" style="padding-top: 150px">
        <div class="text-center">
          <span class="section-subtitle">Philosophy</span>
          <h2 class="section-title">공간의 이야기</h2>
        </div>

        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 4rem;
            margin-top: 3rem;
          "
        >
          <div class="fade-up">
            <img
              src="images/about_detail.jpg"
              alt="Hanok Detail"
              loading="lazy"
              decoding="async"
              style="
                width: 100%;
                height: 500px;
                object-fit: cover;
                border-radius: 4px;
                box-shadow: var(--shadow-soft);
              "
            />
          </div>

          <div
            class="text-center fade-up"
            style="max-width: 1120px; margin: 0 auto"
          >
            <h3 class="copy-headline">오랜 시간을 견뎌온 나무의 숨결</h3>
            <p class="copy-lead copy-medium copy-wide copy-center">
              <span class="copy-line"
                >서촌별곡은 한옥이 지닌 시간의 결을 존중하며, 현대의 휴식
                방식에 맞게 재해석한 공간입니다.</span
              >
              <span class="copy-line"
                >오래된 목재와 흙, 그리고 절제된 편의가 균형을 이루어 머무는
                내내 마음의 속도를 낮춰줍니다.</span
              >
              <span class="copy-line"
                >아침에는 처마 끝으로 스며드는 빛을, 밤에는 마당 위로 내려앉는
                정적을 느껴보세요.</span
              >
              <span class="copy-line"
                >이곳에서의 하루는 여행보다 깊은 쉼에 가깝습니다.</span
              >
            </p>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
  </body>
</html>
