<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us | 서촌별곡</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section class="container fade-up" style="padding-top: 150px">
        <div class="text-center">
          <span class="section-subtitle">Philosophy</span>
          <h2 class="section-title">공간의 이야기</h2>
        </div>

        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 4rem;
            margin-top: 3rem;
          "
        >
          <div class="fade-up">
            <img
              src="images/about_detail.jpg"
              alt="Hanok Detail"
              loading="lazy"
              decoding="async"
              style="
                width: 100%;
                height: 500px;
                object-fit: cover;
                border-radius: 4px;
                box-shadow: var(--shadow-soft);
              "
            />
          </div>

          <div
            class="text-center fade-up"
            style="max-width: 800px; margin: 0 auto"
          >
            <h3 style="font-size: 2rem; margin-bottom: 1.5rem">
              오랜 시간을 견뎌온 나무의 숨결
            </h3>
            <p
              style="
                color: var(--color-text-sub);
                font-size: 1.1rem;
                line-height: 1.8;
              "
            >
              서촌별곡은 100년이 넘는 시간을 견뎌온 고재와 현대적인 건축 소재가
              만난 공간입니다. 우리는 이곳에 머무는 이들이 도시의 소음에서
              벗어나, 자신만의 속도로 흐르는 시간을 마주하길 바랍니다.
              <br /><br />
              아침에는 처마 끝에 걸린 햇살을, 밤에는 마당 위로 쏟아지는 달빛을
              감상해 보세요.
            </p>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/include.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/transitions.js"></script>
  </body>
</html>
